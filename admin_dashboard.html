<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Admin Login</title>
       
        <!-- Reset CSS -->
        <link rel="stylesheet" href="./assets/css/reset.css" />

        <!-- Thêm favicon -->
        <link rel="icon" type="image/x-icon" href="./assets/icons/logo2_no_text.svg">
       

        <!-- Nhúng phông chữ -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        
         <!-- Font Awesome-->
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
       <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/all.min.js" integrity="sha512-6sSYJqDreZRZGkJ3b+YfdhB3MzmuP9R7X1QZ6g5aIXhRvR1Y/N/P47jmnkENm7YL3oqsmI6AK+V6AD99uWDnIw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

        <!-- Kiểu CSS -->
        <link rel="stylesheet" href="./assets/css/style.css" />
        <link rel="stylesheet" href="./assets/css/grid-layout.css">
        <link rel="stylesheet" href="./assets/css/admin-ruleset.css">
        <link rel="stylesheet" href="./assets/css/admin-dashboard.css">
</head>
<body>
    <div class="admin-container grid-layout">
        <div class="header grid-item header-grid">
            <div class="search-func">
                    <div class="search-bar">
                        <input type="text" placeholder="Tìm kiếm sản phẩm..." />
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>

                    </div>
            </div>
            <div class="acount-info">
                <img src="./assets/icons/arrow-down.svg" alt="">
                <div class="account-label">
                    <p class="text text-name"> Tạ Hoàng Phúc</p>
                    <p class="text text-permission"> Admin</p>
                </div>
            </div>
            <div class="signout">
                <div class="logout-icon">
                    <i class="fa-solid fa-arrow-right-from-bracket fa-2x"></i>
                </div>
            </div>

        </div>
        <div class="sidebar grid-item sidebar-grid">
            <div class="logo">
                <img src="./assets/icons/logo2_2.svg" alt="">
            </div>
            <a href="#" class="item1 sidebar-button">
                > Home
            </a>
            <a href="#" class="item2 sidebar-button">
                > Thêm Admin
            </a>
            <a href="#" class="item3 sidebar-button">
                > Quản lý đơn hàng 
            </a>

            <a href="#" class="item4 sidebar-button">
                > Quản lý sản phẩm 
            </a>
        </div>
        <div class="content grid-item content-grid">Content</div>
    </div>
</body>
</html>
