            <a href="admin_addproduct.html" class="sidebar-button">

        <div class="content grid-item content-grid">

                <nav class="navbar tag-line _4c _1r">

        </div>
    </div>

    <script>
            $(document).ready(function () {
                // Hàm tạo dữ liệu ngẫu nhiên
                function generateRandomData() {
                    const categories = ["Gạch lát nền", "Gạch ốp tường", "Gạch trang trí", "Gạch chống trơn"];
                    const statusOptions = ["Còn hàng", "Hết hàng", "Sắp có hàng"];
                    const data = [];

                    for (let i = 1; i <= 200; i++) {
                        const checkBox = "<input type=\"checkbox\"></input>";
                        const productCode = "SP" + String(i).padStart(3, '0');
                        const productName = "Gạch men " + i;
                        const category = categories[Math.floor(Math.random() * categories.length)];
                        const status = statusOptions[Math.floor(Math.random() * statusOptions.length)];
                        const date = new Date(2024, Math.floor(Math.random() * 12), Math.ceil(Math.random() * 28));
                        const formattedDate = date.toISOString().split('T')[0];
                        const price = (Math.floor(Math.random() * 500) + 50) * 1000;
                        const modifyRecord = " <a href=\"#\">Chỉnh sửa</a>" + "<a href=\"#\">Xoá</a>";

                        data.push([
                            checkBox,
                            productCode,
                            productName,
                            category,
                            status,
                            formattedDate,
                            price.toLocaleString('vi-VN') + " VND",
                            modifyRecord,
                        ]);
                    }
                    return data;
                }

                // Thêm dữ liệu vào bảng
                const table = $('#example').DataTable({
                    data: generateRandomData(),
                    columns: [
                        { title: " " },
                        { title: "Mã sản phẩm" },
                        { title: "Tên Sản phẩm" },
                        { title: "Danh mục" },
                        { title: "Trạng thái" },
                        { title: "Ngày nhập" },
                        { title: "Giá bán (VND)" },
                        { title: "Chỉnh sửa" }
                    ],
                    pageLength: 10,
                    language: {
                        lengthMenu: "Hiển thị _MENU_ mục mỗi trang",
                        zeroRecords: "Không tìm thấy kết quả",
                        info: "Hiển thị trang _PAGE_ của _PAGES_",
                        infoEmpty: "Không có dữ liệu",
                        infoFiltered: "(lọc từ _MAX_ tổng mục)"
                    }
                });
            });
        </script>
