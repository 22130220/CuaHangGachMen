<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Tài Khoản Cá Nhân</title>
    <link rel="stylesheet" href="./assets/css/register.css">

       
</head>
<body>

  

    <div class="container">
        
        <div class="content">
            <div class="left-section">
                <img src="https://s7d1.scene7.com/is/image/TileShop/SplendoursPicket_Texture_Detail:Asset_Grid_All_V2?fmt=webp" alt="Gạch Trang Trí">
                <div class="left-text">
                    <h2>Tạo tài khoản cá nhân để đặt hàng thuận tiện hơn</h2>
                    <ul>
                        <li>Tiết kiệm thời gian khi thanh toán.</li>
                        <li>Dễ dàng tổ chức các dự án của bạn.</li>
                        <li>Xem lịch sử đơn hàng, báo giá và phiếu chọn sản phẩm.</li>
                        <li>Đăng ký nhận email để nhận cảm hứng và thông tin sản phẩm.</li>
                    </ul>
                </div>
            </div>
            <div class="right-section">
                <h2><span>🏠</span> Tài Khoản Cá Nhân</h2>
                <form>
                    <div class="form-group">
                        <input type="text" placeholder="Họ" required>
                        <input type="text" placeholder="Tên" required>
                    </div>
                    <input type="email" placeholder="Địa chỉ Email" required>
                    <input type="tel" placeholder="Số Điện Thoại" required>
                    <input type="text" placeholder="Địa Chỉ 1" required>
                    <input type="text" placeholder="Địa Chỉ 2">
                    <div class="form-group">
                        <input type="text" placeholder="Thành Phố" required>
                        <input type="text" placeholder="Tỉnh/Thành" required>
                        <input type="text" placeholder="Mã Bưu Điện" required>
                    </div>
                    <select required>
                        <option value="">Chọn Cửa Hàng Ưu Tiên</option>
                        <option value="store1">Cửa Hàng 1</option>
                        <option value="store2">Cửa Hàng 2</option>
                    </select>
                    <div class="checkbox-group">
                        <input type="checkbox" id="subscribe">
                        <label for="subscribe">Chọn ô này nếu bạn muốn nhận email về sự kiện, xu hướng, và sản phẩm mới.</label>
                    </div>
                    <button type="submit">Tạo Tài Khoản Cá Nhân</button>
                    
                </form>
            </div>
        </div>
    </div>
</body>
</html>
