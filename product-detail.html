<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cửa hàng gạch men</title>

    <!-- Reset CSS -->
    <link rel="stylesheet" href="./assets/css/reset.css" />

    <!-- Thêm favicon -->
    <link
            rel="icon"
            type="image/x-icon"
            href="./assets/icons/logo2_no_text.svg"
    />

    <!-- Nhúng phông chữ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"

    />

    <!-- Font Awesome-->
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
            integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
    />
    <script
            src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/all.min.js"
            integrity="sha512-6sSYJqDreZRZGkJ3b+YfdhB3MzmuP9R7X1QZ6g5aIXhRvR1Y/N/P47jmnkENm7YL3oqsmI6AK+V6AD99uWDnIw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
    ></script>

    <!-- Kiểu CSS -->
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/popular.css">
    <link rel="stylesheet" href="./assets/css/product-detail.css">
    <link rel="stylesheet" href="./assets/css/breadcrumb.css">
</head>
<body>
    <div class="breadcumb">
        <div class="main-content">
            <div class="product-details-grid">
                <div class="fui-basic-breadcrumb breadcrumb-grid-contain">
                    <ul class="breadcrumb-list">
                        <li class="breadcrumb-item">
                            <a href="#" class="breadcrumb-link">
                                Home
                            </a>
                        </li>
                        <li class="breadcrumb-item">
                            <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="24"
                                    height="24"
                                    fill="none"
                                    viewBox="0 0 24 24"
                            >
                                <path
                                        fill="currentColor"
                                        fill-rule="evenodd"
                                        d="M9.793 7.793a1 1 0 000 1.414L12.586 12l-2.793 2.793a1 1 0 101.414 1.414l3.5-3.5a1 1 0 000-1.414l-3.5-3.5a1 1 0 00-1.414 0z"
                                        clip-rule="evenodd"
                                ></path>
                            </svg>
                            <a href="#" class="breadcrumb-link">template</a>
                        </li>
                        <li class="breadcrumb-item">
                            <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="24"
                                    height="24"
                                    fill="none"
                                    viewBox="0 0 24 24"
                            >
                                <path
                                        fill="currentColor"
                                        fill-rule="evenodd"
                                        d="M9.793 7.793a1 1 0 000 1.414L12.586 12l-2.793 2.793a1 1 0 101.414 1.414l3.5-3.5a1 1 0 000-1.414l-3.5-3.5a1 1 0 00-1.414 0z"
                                        clip-rule="evenodd"
                                ></path>
                            </svg>
                            <a href="#" class="breadcrumb-link">Fast UI</a>
                        </li>
                    </ul>
                </div>
                <div class="product-img img-grid">

                    <div class="column">
                        <div id="slide-wrapper">
                            <img id="slideLeft" class="arrow" src="./assets/img/arrow-left.png">

                            <div id="slider">
                                <img class="thumbnail active" src="./assets/img/shoe1.jpg">
                                <img class="thumbnail" src="./assets/img/shoe2.jpg">
                                <img class="thumbnail" src="./assets/img/shoe3.jpg">

                                <img class="thumbnail" src="./assets/img/preset1.png">
                                <img class="thumbnail" src="./assets/img/preset2.jpg">
                                <img class="thumbnail" src="./assets/img/preset3.jpg">
                                <img class="thumbnail" src="./assets/img/preset4.jpg">
                            </div>

                            <img id="slideRight" class="arrow" src="./assets/img/arrow-right.png">
                        </div>
                        <img id=featured src="./assets/img/shoe1.jpg">
                    </div>
                </div>
                <div class="sumarize-info sumarize-grid">

                </div>
            </div>

        </div>
    </div>
    <script type="text/javascript">
        let thumbnails = document.getElementsByClassName('thumbnail')

        let activeImages = document.getElementsByClassName('active')

        for (var i=0; i < thumbnails.length; i++){

            thumbnails[i].addEventListener('mouseover', function(){
                console.log(activeImages)

                if (activeImages.length > 0){
                    activeImages[0].classList.remove('active')
                }


                this.classList.add('active')
                document.getElementById('featured').src = this.src
            })
        }


        let buttonRight = document.getElementById('slideRight');
        let buttonLeft = document.getElementById('slideLeft');

        buttonLeft.addEventListener('click', function(){
            document.getElementById('slider').scrollTop -= 180
        })

        buttonRight.addEventListener('click', function(){
            document.getElementById('slider').scrollY -= 180
        })


    </script>
</body>
</html>
